<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Seite nicht gefunden · Future Skills Evidence Graph</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#f7f8f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1613" media="(prefers-color-scheme: dark)" />
    <script>
      // Farbtheme vor dem ersten Paint setzen (gleiche Logik wie die anderen Seiten).
      (function () {
        try {
          var stored = localStorage.getItem("fseg-theme");
          var theme = stored || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
    <!-- Styles bewusst inline: eine 404 wird unter beliebig tiefen Pfaden
         ausgeliefert, relative ./assets-Verweise wuerden dort brechen. -->
    <style>
      :root {
        --bg: #f7f8f6; --surface: #fff; --text: #1e2524; --muted: #5a6663;
        --line: #d8e0dc; --green: #1f7a5d; --blue: #315f9f; --focus: #315f9f;
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      :root[data-theme="dark"] {
        --bg: #0f1613; --surface: #16211d; --text: #e8efeb; --muted: #a1b0aa;
        --line: #2c3a34; --green: #4fb894; --blue: #86aee6; --focus: #86aee6;
        color-scheme: dark;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; background: var(--bg); color: var(--text); line-height: 1.5;
        min-height: 100vh; display: grid; place-items: center; padding: 24px;
      }
      main {
        background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
        max-width: 520px; padding: clamp(24px, 5vw, 40px); text-align: left;
      }
      .eyebrow {
        color: var(--green); font-size: 12px; font-weight: 800; letter-spacing: 0;
        margin: 0 0 6px; text-transform: uppercase;
      }
      h1 { font-size: clamp(24px, 4vw, 32px); margin: 0 0 10px; }
      p { color: var(--muted); margin: 0 0 20px; max-width: 60ch; }
      a.home {
        align-items: center; background: var(--green); border-radius: 8px;
        color: #fff; display: inline-flex; font-weight: 700; min-height: 44px;
        padding: 0 18px; text-decoration: none;
      }
      a.home:hover { filter: brightness(1.05); }
      a.home:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Fehler 404</p>
      <h1>Diese Seite gibt es nicht</h1>
      <p>
        Der aufgerufene Link führt ins Leere – vielleicht ist er veraltet oder
        enthält einen Tippfehler. Der Katalog selbst ist weiterhin da.
      </p>
      <a class="home" id="homeLink" href="/">Zum Dashboard</a>
    </main>
    <script>
      // Home-Link auf die Wurzel des (Projekt-)Pages-Sites zeigen lassen:
      // https://<owner>.github.io/<repo>/ → /<repo>/ . Lokal/als User-Page → / .
      (function () {
        var seg = location.pathname.split("/").filter(Boolean)[0];
        var isPage = location.hostname.endsWith(".github.io");
        document.getElementById("homeLink").setAttribute("href", isPage && seg ? "/" + seg + "/" : "/");
      })();
    </script>
  </body>
</html>
