name: Import report candidate (manual)

# Manually triggered ONLY. API-less report bodies (OECD / WEF / UNESCO) are
# imported via an LLM, which costs money and needs a human to choose the report
# and its plaintext, so this is never part of the mandatory CI (see validate.yml)
# and never runs on a schedule. It writes into the same candidate pull-request
# path as the research pipeline; every source and claim stays a candidate until a
# human reviews it.
on:
  workflow_dispatch:
    inputs:
      report_path:
        description: "Single report plaintext path (PDF extraction done separately). Ignored if manifest is set."
        required: false
        default: ""
      url:
        description: "Canonical URL of the single report. Ignored if manifest is set."
        required: false
        default: ""
      publisher:
        description: "Publishing organisation (e.g. OECD, WEF, UNESCO)."
        required: false
        default: ""
      year:
        description: "Publication year override (optional)."
        required: false
        default: ""
      manifest:
        description: "Path to a JSON manifest of {report, url, publisher?, year?} entries to import in one run."
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  import-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Restore pending candidates from open pull request branch
        run: |
          # Reuse the research pipeline's candidate branch so the report importer
          # deduplicates against candidates already awaiting review. The restore
          # MERGES rather than checking the files out: reviews live in the same
          # candidates-*.json files, so overwriting them would revert every review
          # already merged into the base branch (see
          # scripts/restore_pending_candidates.py).
          if git fetch origin research/candidates; then
            python scripts/restore_pending_candidates.py --ref FETCH_HEAD
          fi
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt
      - name: Import report candidate(s) (LLM)
        run: |
          if [ -n "${MANIFEST}" ]; then
            python scripts/ingest_reports.py --manifest "${MANIFEST}"
          else
            python scripts/ingest_reports.py \
              --report "${REPORT_PATH}" \
              --url "${URL}" \
              ${PUBLISHER:+--publisher "${PUBLISHER}"} \
              ${YEAR:+--year "${YEAR}"}
          fi
        env:
          MANIFEST: ${{ inputs.manifest }}
          REPORT_PATH: ${{ inputs.report_path }}
          URL: ${{ inputs.url }}
          PUBLISHER: ${{ inputs.publisher }}
          YEAR: ${{ inputs.year }}
          AI_PROVIDER: anthropic
          AI_MODEL: ${{ vars.AI_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Cluster candidate skills
        run: python scripts/cluster_claims.py
      - name: Validate candidates
        run: python scripts/validate_data.py
      - name: Open or update candidate pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for pattern in "data/sources/candidates-*.json" "data/claims/candidates-*.json" "data/skills/candidates-*.json"; do
            if compgen -G "$pattern" > /dev/null; then
              git add -- $pattern
            fi
          done
          if git diff --cached --quiet; then
            echo "No candidate changes."
            exit 0
          fi
          branch="research/candidates"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Rebuild the candidate branch from the current base, preserving the
          # pending candidates restored above, then refresh the open pull request.
          git checkout -B "$branch"
          git commit -m "chore: add report candidate"
          git push --force origin "$branch"
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --title "chore: add research candidates" \
              --body "Manual report import (OECD/WEF/UNESCO): a candidate source plus verbatim finding-claims. Everything remains a candidate until reviewed." \
              --base "${GITHUB_REF_NAME}" \
              --head "$branch"
          else
            echo "Updated existing pull request for $branch."
          fi
