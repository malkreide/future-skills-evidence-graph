name: counter-evidence

# Manual only, never scheduled. A lane that hunts for contradictions every week
# unprompted produces review load without an occasion — and the catalogue's
# review capacity is the scarce resource, not search. See
# docs/gegenevidenz-lane.md ("Was die Lane nicht darf").
on:
  workflow_dispatch:
    inputs:
      skill:
        description: "Active skill id to challenge (e.g. skill-systems-thinking)"
        required: true
        type: string
      dry_run:
        description: "Report findings without writing any candidate claim"
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

jobs:
  counter-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Both files, because the lane uses the core's helpers. The regular
      # validate workflow installs ONLY requirements-dev.txt, which is what
      # proves the core does not need langgraph.
      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install -r requirements-agents.txt

      - name: Search for counter-evidence
        env:
          AI_PROVIDER: anthropic
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENALEX_MAILTO: ${{ secrets.OPENALEX_MAILTO }}
        run: |
          python agents/counter_evidence.py \
            --skill "${{ inputs.skill }}" \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      # The run log IS the deliverable of a dry run — it carries which backend
      # answered, how many sources were examined and which limit stopped the
      # graph, none of which the console output shows. On a dry run nothing is
      # committed and no pull request opens, so without this step the log is
      # discarded with the runner and the run cannot be judged at all. Written
      # to the job summary rather than an artifact: no new pinned action, and it
      # is readable in the UI next to the run that produced it.
      - name: Publish the run log to the job summary
        if: always()
        run: |
          log=$(ls -1t agents/runs/*.json 2>/dev/null | head -1)
          if [ -z "$log" ]; then
            echo "No run log was written." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## Counter-evidence run log"
            echo
            echo "\`$log\`"
            echo
            echo '```json'
            cat "$log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Also on stdout, so a failed run that never renders a summary still
          # leaves the trail in the job log.
          cat "$log"

      # A dry run writes no candidates, so the non-dry path below never fires and
      # its run log would live only in the job summary — fine for reading one
      # run, useless for the activation decision, which compares three. Collect
      # them on one branch instead: rebuilt from main each time so the pull
      # request never drifts, with previously committed logs carried forward so
      # the branch accumulates rather than replaces.
      - name: Collect the dry-run log for review
        if: ${{ inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          SKILL: ${{ inputs.skill }}
        run: |
          log=$(ls -1t agents/runs/*.json 2>/dev/null | head -1)
          [ -n "$log" ] || { echo "No run log to collect."; exit 0; }
          cp "$log" /tmp/run-log.json

          branch="chore/counter-evidence-runs"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          # Bring forward whatever the branch already carries. A same-named log
          # (same day, same skill) is then overwritten by this run's, which is
          # the newer truth.
          if git fetch origin "$branch" 2>/dev/null; then
            git checkout FETCH_HEAD -- agents/runs/ 2>/dev/null || true
          fi
          mkdir -p agents/runs
          cp /tmp/run-log.json "$log"

          git add -- agents/runs
          if git diff --cached --quiet; then
            echo "Run log already collected; nothing to commit."
            exit 0
          fi
          git commit -m "chore(agents): collect counter-evidence dry-run log for ${SKILL}"
          git push --force origin "$branch"
          body=$(printf '%s\n' \
            "Counter-evidence **dry-run logs**, collected for the activation decision." \
            "" \
            "No candidate claims or sources are in here — a dry run writes none. Each log" \
            "records the queries the graph chose, which backend answered, how many sources" \
            "were examined per round, and which limit stopped it." \
            "" \
            "Read \`stopped_because\` before the finding count: \`no_new_findings\` means the" \
            "search went quiet, while \`query_budget\` or \`round_limit\` means it was cut off" \
            "while possibly still productive. Those are opposite conclusions about the" \
            "literature, and only the log tells them apart." \
            "" \
            "Precision is a reviewer's judgement over the proposed contradictions, not a" \
            "number in these files. Activation needs >= 0.5 across three runs.")
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create --title "chore(agents): counter-evidence dry-run logs" \
              --body "$body" --base "${GITHUB_REF_NAME}" --head "$branch"
          else
            gh pr edit "$branch" --body "$body"
          fi

      # Candidates only, and validated before they can reach a pull request —
      # the same gate every importer passes.
      - name: Validate the repository
        if: ${{ !inputs.dry_run }}
        run: python scripts/validate_data.py

      # Same mechanism as the weekly research pipeline (gh, no third-party
      # action), so both candidate lanes behave identically for a reviewer.
      - name: Open a review pull request
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKILL: ${{ inputs.skill }}
        run: |
          set -euo pipefail
          # data/sources too: the claims cite freshly discovered sources, and a
          # claim whose source is not in the commit fails validate_data.py.
          git add data/sources data/claims agents/runs
          if git diff --cached --quiet; then
            echo "No counter-evidence candidates in this run; nothing to review."
            exit 0
          fi
          branch="research/counter-evidence"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git commit -m "research: counter-evidence candidates for ${SKILL}"
          git push --force origin "$branch"
          url="$(gh pr list --head "$branch" --state open --json url --jq '.[0].url')"
          if [ -z "$url" ]; then
            gh pr create \
              --title "Counter-evidence candidates: ${SKILL}" \
              --body "Candidate counter-evidence produced by the agentic lane (\`agents/counter_evidence.py\`, see docs/gegenevidenz-lane.md). **Everything here is a candidate.** Each claim's statement is a verbatim quote whose presence in the source abstract was verified before the claim was created; the review fields are placeholders. Promote with scripts/promote_candidate.py after checking the quote against the source. The run log under \`agents/runs/\` records which queries were asked, how many sources were examined, and why the graph stopped — the agent is not reproducible the way the core pipeline is, so it is auditable instead." \
              --base "${GITHUB_REF_NAME}" \
              --head "$branch"
          else
            echo "Updated existing pull request: $url"
          fi
