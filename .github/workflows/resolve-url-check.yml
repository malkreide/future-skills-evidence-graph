name: Resolve URL check (diagnostic)

# Manual smoke test for the source-URL resolver (Option B): enter a report title
# and see which tier (document / Crossref / OpenAlex / SearXNG / DuckDuckGo /
# Google) resolves a URL, and whether the optional backends are configured.
# Makes no LLM call, opens no PR, changes no data.
on:
  workflow_dispatch:
    inputs:
      title:
        description: "Report title to resolve a URL for."
        required: true
      year:
        description: "Publication year (optional, sharpens catalogue matching)."
        required: false
        default: ""
      publisher:
        description: "Publisher (optional)."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  resolve-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install the optional open-source search tier (DuckDuckGo)
        # Same pin as requirements-dev.txt — no floating installs in CI.
        run: pip install ddgs==9.14.4
      - name: Resolve URL for the given title
        # Inputs are passed via env (never interpolated into the shell) to avoid
        # script injection from the title/publisher text.
        env:
          TITLE: ${{ inputs.title }}
          YEAR: ${{ inputs.year }}
          PUBLISHER: ${{ inputs.publisher }}
          # Optional open-web tiers: SEARXNG_URL points at a self-hosted SearXNG;
          # RESOLVE_OPEN_WEB=1 lifts the credible-domain allowlist.
          SEARXNG_URL: ${{ vars.SEARXNG_URL }}
          RESOLVE_OPEN_WEB: ${{ vars.RESOLVE_OPEN_WEB }}
          GOOGLE_SEARCH_API_KEY: ${{ secrets.GOOGLE_SEARCH_API_KEY }}
          # cx is not sensitive — accept it as a variable OR a secret so it works
          # wherever it was stored.
          GOOGLE_SEARCH_CX: ${{ vars.GOOGLE_SEARCH_CX || secrets.GOOGLE_SEARCH_CX }}
        run: |
          python scripts/resolve_source_url.py \
            --title "$TITLE" \
            ${YEAR:+--year "$YEAR"} \
            ${PUBLISHER:+--publisher "$PUBLISHER"}
