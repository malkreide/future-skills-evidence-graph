name: Research candidate import

on:
  workflow_dispatch:
    inputs:
      queries:
        description: "Optional search queries for this run (one per line or comma-separated). Empty uses config/research_queries.json."
        required: false
        type: string
      include_catalog:
        description: "Also derive a query per active catalog skill for this run."
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  import-candidates:
    runs-on: ubuntu-latest
    # RESEARCH_QUERIES is empty on the scheduled run, so the importers fall back to
    # the versioned config/research_queries.json; a manual dispatch can override it.
    # RESEARCH_QUERIES_INCLUDE_CATALOG opts into deriving a query per active skill:
    # the dispatch checkbox wins, else the repo variable (unset = off), so the
    # scheduled run only follows the catalog when a maintainer enables it.
    # NB: use the typed `inputs.include_catalog` (a real boolean), NOT
    # `github.event.inputs.*` — the latter is always a string, and the string
    # "false" is truthy in GitHub expressions, so it would shadow the repo
    # variable on every manual run and the checkbox could never fall back to it.
    env:
      RESEARCH_QUERIES: ${{ inputs.queries }}
      RESEARCH_QUERIES_INCLUDE_CATALOG: ${{ inputs.include_catalog || vars.RESEARCH_QUERIES_INCLUDE_CATALOG }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Restore pending candidates from open pull request branch
        run: |
          # Candidates from an earlier run may still sit unmerged on the
          # research/candidates branch. Restoring them lets the importers
          # deduplicate against them instead of importing them again.
          # The restore MERGES: promote_candidate.py flips status in place inside
          # the candidates-*.json files, so checking the files out wholesale would
          # revert every review already merged into the base branch (see
          # scripts/restore_pending_candidates.py). Stdlib only -- it runs before
          # the dependency install on purpose, so a broken restore fails here.
          if git fetch origin research/candidates; then
            python scripts/restore_pending_candidates.py --ref FETCH_HEAD
          fi
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt
      - name: Import OpenAlex candidates
        run: >
          python scripts/ingest_openalex.py
          --limit 20
          --output data/sources/candidates-openalex.json
          --mailto "${OPENALEX_MAILTO}"
        env:
          OPENALEX_MAILTO: ${{ vars.OPENALEX_MAILTO }}
      - name: Import Crossref candidates
        run: >
          python scripts/ingest_crossref.py
          --limit 20
          --output data/sources/candidates-crossref.json
      - name: Import Semantic Scholar candidates
        run: >
          python scripts/ingest_semantic_scholar.py
          --limit 20
          --output data/sources/candidates-semantic-scholar.json
        env:
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
      - name: Import arXiv candidates
        run: >
          python scripts/ingest_arxiv.py
          --limit 20
          --output data/sources/candidates-arxiv.json
      - name: Import ERIC candidates
        run: >
          python scripts/ingest_eric.py
          --limit 20
          --output data/sources/candidates-eric.json
      - name: Extract candidate claims
        run: python scripts/extract_claims.py
      - name: Cluster candidate skills
        run: python scripts/cluster_claims.py
      - name: Validate candidates
        run: python scripts/validate_data.py
      - name: Open or update candidate pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for pattern in "data/sources/candidates-*.json" "data/claims/candidates-*.json" "data/skills/candidates-*.json"; do
            if compgen -G "$pattern" > /dev/null; then
              git add -- $pattern
            fi
          done
          if git diff --cached --quiet; then
            echo "No candidate changes."
            echo "summary=Keine neuen Kandidaten in diesem Lauf." >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --cached --name-only | wc -l | tr -d ' ')"
          branch="research/candidates"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The branch is rebuilt from the current base on every run, so the
          # force push keeps the open pull request based on the latest base
          # while preserving its pending candidates (restored above).
          git checkout -B "$branch"
          git commit -m "chore: add research candidates"
          git push --force origin "$branch"
          url="$(gh pr list --head "$branch" --state open --json url --jq '.[0].url')"
          if [ -z "$url" ]; then
            url="$(gh pr create \
              --title "chore: add research candidates" \
              --body "Automated candidate import: sources, claims extracted from their abstracts, and clustered candidate skills. Everything remains a candidate until reviewed." \
              --base "${GITHUB_REF_NAME}" \
              --head "$branch")"
          else
            echo "Updated existing pull request for $branch."
          fi
          echo "summary=Neue Kandidaten gefunden (${changed} Datei(en) aktualisiert). Review-PR: ${url}" >> "$GITHUB_OUTPUT"
      # Optional Telegram mirror (docs/telegram-integration.md): the notify
      # script is a no-op without the secrets and never fails the pipeline.
      - name: Telegram notification (result)
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUMMARY: ${{ steps.pr.outputs.summary }}
        run: >
          python3 scripts/telegram_notify.py
          --title "🔎 Wöchentliche Recherche abgeschlossen"
          --text "${SUMMARY}"
      - name: Telegram notification (failure)
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: >
          python3 scripts/telegram_notify.py
          --title "⚠️ Recherche-Pipeline fehlgeschlagen"
          --text "Details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

