name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt
      - name: Validate evidence data
        run: python scripts/validate_data.py
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Evaluate LLM claim pre-fill (offline, fixtures)
        run: >-
          python scripts/eval_claim_prefill.py
          --min-precision 0.8
          --min-evidence-strength-precision 0.7 --min-age-range-precision 0.8
      - name: Build static dashboard
        run: python scripts/build_site.py

