name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt
      - name: Validate evidence data
        run: python scripts/validate_data.py
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Evaluate LLM claim pre-fill (offline, fixtures)
        run: >-
          python scripts/eval_claim_prefill.py
          --min-precision 0.8
          --min-evidence-strength-precision 0.7 --min-age-range-precision 0.8
      - name: Build static dashboard
        run: python scripts/build_site.py

