name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt
      - name: Validate evidence data
        run: python scripts/validate_data.py
      - name: Run tests
        run: python -m unittest discover -s tests
      # outcome/context are now scored semantically (embedding cosine over the
      # committed vectors), so they can carry a floor at last. Those two gates
      # skip themselves rather than fail if the embedding fixtures are missing --
      # the lexical fallback cannot meet a semantic floor, and a missing file is
      # not a regression. See OPERATIONS.md "How the free-text fields are scored".
      - name: Evaluate LLM claim pre-fill (offline, fixtures)
        run: >-
          python scripts/eval_claim_prefill.py
          --min-precision 0.8
          --min-evidence-strength-precision 0.7 --min-age-range-precision 0.8
          --min-outcome-precision 0.75 --min-context-precision 0.85
      # Skill links, gated on abstention and only loosely on precision. The
      # denominators are small and unequal, which decides what can carry a floor:
      # abstention is 40 empty-gold examples (one flip = 0.025), precision is 14
      # link instances (0.071) and recall 11 gold links (0.091). Abstention is
      # also the number that governs review load -- an over-eager model floods
      # the reviewer with plausible links on the 40, long before precision over
      # the other 10 looks bad. Measured 0.93 / 0.71; recall is deliberately
      # ungated. See OPERATIONS.md "Optional skill-link suggestion".
      - name: Evaluate skill-link suggestions (offline, fixtures)
        run: >-
          python scripts/eval_skill_links.py
          --min-abstention 0.85 --min-precision 0.6
      - name: Build static dashboard
        run: python scripts/build_site.py

