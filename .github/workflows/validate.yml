name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt
      - name: Validate evidence data
        run: python scripts/validate_data.py
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Evaluate LLM claim pre-fill (offline, fixtures)
        run: >-
          python scripts/eval_claim_prefill.py
          --min-precision 0.8
          --min-evidence-strength-precision 0.7 --min-age-range-precision 0.8
      - name: Build static dashboard
        run: python scripts/build_site.py

