name: Telegram intake

# Inbound half of the OPTIONAL Telegram integration (docs/telegram-integration.md)
# in two modes, same script, same logic:
#
# - PULL (default): the schedule polls the Bot API (getUpdates) and processes
#   whatever queued up — no webhook endpoint, fully serverless.
# - PUSH (optional real-time): the Cloudflare relay (relay/telegram-webhook-relay.js)
#   receives Telegram's webhook and dispatches THIS workflow with the single
#   update as input; replies then arrive in seconds. While a webhook is set,
#   Telegram rejects getUpdates (409) and the scheduled poll no-ops cleanly.
#
# Either way each authorized chat message becomes a "Bericht einreichen" issue,
# i.e. the SAME intake path as the issue form. Without the TELEGRAM_BOT_TOKEN
# secret every run is a seconds-cheap no-op; repos without a bot can also
# simply disable this workflow in the Actions UI.
on:
  schedule:
    # Poll-mode latency (and the safety net under push mode): a chat message
    # is picked up within ~10 minutes. "Jetzt abholen" = run manually. Public
    # repo, standard runners: these no-op-cheap runs cost nothing.
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      update:
        description: "Internal (webhook relay): one Telegram update as JSON. Leave empty to poll."
        required: false
        type: string
      update_id:
        description: "Internal (webhook relay): the update_id, used for concurrency grouping."
        required: false
        type: string

# No top-level grant: the job declares only what it needs.
permissions: {}

# Two overlapping POLLS would double-process the same updates (the offset is
# only advanced once per run), so polls share one queued group. PUSH runs each
# carry exactly one distinct update: they group by update_id so GitHub's
# "one pending run per group" rule cannot silently drop a queued message.
concurrency:
  group: telegram-intake-${{ github.event.inputs.update_id || 'poll' }}
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      # Secrets are not readable in job-level `if:` conditions, so a first
      # step decides and everything else keys off its output — an unconfigured
      # repo pays a few seconds per scheduled run, nothing more.
      - name: Check whether Telegram is configured
        id: config
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ -n "${TELEGRAM_BOT_TOKEN}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "TELEGRAM_BOT_TOKEN ist nicht gesetzt – Intake übersprungen."
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.config.outputs.enabled == 'true'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.config.outputs.enabled == 'true'
        with:
          python-version: "3.12"
      - name: Install PDF extraction dependency
        if: steps.config.outputs.enabled == 'true'
        # Only pypdf is needed (for PDF attachments); the pin comes from
        # requirements-dev.txt so this stays a single source of truth without
        # installing the full (heavy) dev stack on every run.
        run: pip install "$(grep -E '^pypdf==' requirements-dev.txt)"
      - name: Process Telegram messages and file intake issues
        if: steps.config.outputs.enabled == 'true'
        env:
          # Push mode: set by the webhook relay's dispatch; empty means poll.
          TELEGRAM_UPDATE: ${{ github.event.inputs.update }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Optional: additional chats allowed to submit (comma-separated);
          # empty falls back to TELEGRAM_CHAT_ID.
          TELEGRAM_ALLOWED_CHAT_IDS: ${{ secrets.TELEGRAM_ALLOWED_CHAT_IDS }}
          # Optional fine-grained PAT (issues: read/write). With it, created
          # issues fire the ingest-from-issue workflow automatically; with the
          # default token GitHub's recursion guard suppresses that trigger and
          # a maintainer re-sets the `ingest-approved` label to start the
          # import (the chat reply says which case applies).
          TELEGRAM_GITHUB_TOKEN: ${{ secrets.TELEGRAM_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          # Optional: overrides the /dashboard link (e.g. a custom domain);
          # empty derives the standard GitHub-Pages URL from the repository.
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
        run: python scripts/telegram_intake.py
