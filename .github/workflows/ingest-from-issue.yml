name: Import report from issue (manual)

# Mobile-friendly, drag-and-drop manual intake. A human files the
# "Bericht einreichen" issue form (.github/ISSUE_TEMPLATE/ingest-report.yml),
# which carries the `ingest` label; this workflow resolves the pasted text /
# attached PDF / PDF URL into plaintext and runs the SAME LLM report importer and
# candidate-PR path as the manual ingest-reports workflow. Like everything else,
# it only ever produces candidates for human review; nothing is auto-activated.
#
# Abuse/cost control: the LLM import (a paid API call) only runs for issues
# filed by the repository's own people (owner/member/collaborator). Anyone else
# can still submit — their issue gets a comment and waits until a maintainer
# adds the `ingest-approved` label, which re-fires this workflow via `labeled`.
# The `edited` trigger is deliberately absent: every body edit would re-run the
# paid import; re-triggering is a maintainer action (re-adding a label) instead.
on:
  issues:
    types: [opened, labeled]

# No top-level grant: each job declares only what it needs.
permissions: {}

# A re-trigger while a run is in flight should supersede it, not race it.
concurrency:
  group: ingest-issue-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  # External submissions are welcome but must not spend API budget unreviewed:
  # tell the submitter a maintainer will approve, exactly once (on open).
  request-approval:
    if: >-
      github.event.action == 'opened' &&
      contains(github.event.issue.labels.*.name, 'ingest') &&
      !contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association) &&
      !contains(github.event.issue.labels.*.name, 'ingest-approved')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Comment that a maintainer must approve the import
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "$REPO" \
            --body "Danke für die Einreichung! Der automatische Import (LLM-Auswertung) startet, sobald ein Maintainer das Label \`ingest-approved\` setzt. Bis dahin passiert nichts — das Issue geht nicht verloren."

  import-from-issue:
    # Only the report-intake issues (the `ingest` label), and only when the
    # author is repo-trusted OR a maintainer has added `ingest-approved`.
    # Labels are maintainer-controlled, so the approval label cannot be
    # self-served by the submitter.
    if: >-
      contains(github.event.issue.labels.*.name, 'ingest') &&
      (contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association) ||
       contains(github.event.issue.labels.*.name, 'ingest-approved'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Restore pending candidates from open pull request branch
        run: |
          # Reuse the research pipeline's candidate branch so this import
          # deduplicates against candidates already awaiting review. The restore
          # MERGES rather than checking the files out: reviews live in the same
          # candidates-*.json files, so overwriting them would revert every review
          # already merged into the base branch (see
          # scripts/restore_pending_candidates.py).
          if git fetch origin research/candidates; then
            python scripts/restore_pending_candidates.py --ref FETCH_HEAD
          fi
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt
      - name: Parse issue into an import manifest
        id: parse
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          GITHUB_TOKEN: ${{ github.token }}
          # Optional, opt-in: only set these to enable the Google fallback for
          # grey literature the keyless catalogues miss. Unset → that tier is a
          # no-op; Crossref/OpenAlex still run without any key.
          # Open-source web-search tiers (no key): DuckDuckGo runs out of the box
          # (ddgs is in requirements-dev); SEARXNG_URL opts into a self-hosted
          # SearXNG; RESOLVE_OPEN_WEB=1 lifts the credible-domain allowlist.
          SEARXNG_URL: ${{ vars.SEARXNG_URL }}
          RESOLVE_OPEN_WEB: ${{ vars.RESOLVE_OPEN_WEB }}
          GOOGLE_SEARCH_API_KEY: ${{ secrets.GOOGLE_SEARCH_API_KEY }}
          # cx is not sensitive — accept it as a variable OR a secret.
          GOOGLE_SEARCH_CX: ${{ vars.GOOGLE_SEARCH_CX || secrets.GOOGLE_SEARCH_CX }}
        run: python scripts/parse_ingest_issue.py --workdir .ingest_work
      - name: Comment when nothing to import
        if: steps.parse.outputs.status != 'ingest'
        env:
          GH_TOKEN: ${{ github.token }}
          REASON: ${{ steps.parse.outputs.reason }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" \
            --body "⚠️ Kein Import ausgeführt: ${REASON}"
      - name: Import report candidate(s) (LLM)
        if: steps.parse.outputs.status == 'ingest'
        env:
          MANIFEST: ${{ steps.parse.outputs.manifest }}
          AI_PROVIDER: anthropic
          AI_MODEL: ${{ vars.AI_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/ingest_reports.py --manifest "${MANIFEST}"
      - name: Cluster candidate skills
        if: steps.parse.outputs.status == 'ingest'
        run: python scripts/cluster_claims.py
      - name: Validate candidates
        if: steps.parse.outputs.status == 'ingest'
        run: python scripts/validate_data.py
      - name: Open or update candidate pull request
        id: pr
        if: steps.parse.outputs.status == 'ingest'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          for pattern in "data/sources/candidates-*.json" "data/claims/candidates-*.json" "data/skills/candidates-*.json"; do
            if compgen -G "$pattern" > /dev/null; then
              git add -- $pattern
            fi
          done
          if git diff --cached --quiet; then
            echo "result=No new candidates (already known or filtered as off-scope)." >> "$GITHUB_OUTPUT"
            exit 0
          fi
          branch="research/candidates"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git commit -m "chore: add report candidate from issue #${ISSUE_NUMBER}"
          git push --force origin "$branch"
          number="$(gh pr list --head "$branch" --state open --json number --jq '.[].number')"
          if [ -z "$number" ]; then
            number="$(gh pr create \
              --title "chore: add research candidates" \
              --body "Manual report imports (issue form): candidate sources plus verbatim finding-claims. Everything remains a candidate until reviewed." \
              --base "${GITHUB_REF_NAME}" \
              --head "$branch")"
          fi
          echo "result=Kandidaten ergänzt und im Review-PR bereitgestellt: ${number}" >> "$GITHUB_OUTPUT"
      - name: Comment result on the issue
        if: steps.parse.outputs.status == 'ingest'
        env:
          GH_TOKEN: ${{ github.token }}
          PARSE_REASON: ${{ steps.parse.outputs.reason }}
          PR_RESULT: ${{ steps.pr.outputs.result }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" \
            --body "✅ Import gelaufen. ${PARSE_REASON} ${PR_RESULT}"
      # Optional Telegram mirror (docs/telegram-integration.md): the notify
      # script is a no-op without the secrets and never fails the workflow.
      - name: Telegram notification (result)
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATUS: ${{ steps.parse.outputs.status }}
          REASON: ${{ steps.parse.outputs.reason }}
          PR_RESULT: ${{ steps.pr.outputs.result }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
        run: |
          if [ "$STATUS" = "ingest" ]; then
            python3 scripts/telegram_notify.py \
              --title "📄 Bericht-Import gelaufen (Issue #${ISSUE_NUMBER})" \
              --line "${REASON}" \
              --line "${PR_RESULT}" \
              --text "${ISSUE_URL}"
          else
            python3 scripts/telegram_notify.py \
              --title "📄 Bericht-Import übersprungen (Issue #${ISSUE_NUMBER})" \
              --line "${REASON}" \
              --text "${ISSUE_URL}"
          fi
      - name: Telegram notification (failure)
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: >
          python3 scripts/telegram_notify.py
          --title "⚠️ Bericht-Import fehlgeschlagen (Issue #${ISSUE_NUMBER})"
          --text "Details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
