# Keeps the exactly-pinned dependencies current: requirements-dev.txt uses
# `==` pins and the workflows pin action tags, so updates arrive as reviewable
# pull requests instead of floating into externally triggerable CI runs.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    groups:
      python-deps:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
